<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哈伯深空探索 ─ 膨脹宇宙密室逃脫</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #f0f9ff;
      --bg-gradient: linear-gradient(135deg, #f0f9ff 0%, #fdf4ff 50%, #f0fdf4 100%);
      --card-bg: #ffffff;
      --card-border: #bae6fd;
      --theme-color: #0284c7;
      --accent: #0369a1;
      --text-main: #1e293b;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', 'Outfit', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 880px;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }
    .back-nav-row {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 1rem;
      background: #ffffff;
      border: 1.5px solid #bae6fd;
      border-radius: 9999px;
      color: #0284c7;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(14, 165, 233, 0.08);
      transition: all 0.2s ease;
    }
    .back-nav:hover {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      transform: translateY(-1px);
    }
    .lab-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .lab-subtitle {
      font-size: 0.9rem;
      color: #0369a1;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .card {
      background: #ffffff;
      border: 2px solid #bae6fd;
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      box-shadow: 0 20px 40px -10px rgba(14, 165, 233, 0.15), 0 10px 20px -5px rgba(0, 0, 0, 0.04);
      position: relative;
    }

    .top-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      color: #0f172a;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 12px 20px;
      margin-bottom: 25px;
      font-weight: 700;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }
    .status-item i { color: #0284c7; }

    /* Stage Steps Map */
    .stages-map {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }
    .stage-pill {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-sm);
      padding: 8px 4px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }
    .stage-pill.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .stage-pill.solved {
      background: #dcfce7;
      border-color: #22c55e;
      color: #15803d;
    }

    /* Question Panel */
    .quest-box {
      background: #f8fafc;
      border: 1.5px solid #e0f2fe;
      border-radius: var(--radius-md);
      padding: 22px;
      margin-bottom: 22px;
    }
    .quest-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 12px;
    }
    .quest-clue {
      font-size: 1.05rem;
      line-height: 1.75;
      color: #334155;
      margin-bottom: 16px;
    }
    .quest-prompt {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0369a1;
      margin-bottom: 16px;
      padding-top: 12px;
      border-top: 1.5px dashed #cbd5e1;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .answer-input {
      flex: 1;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 1.1rem;
      color: #0f172a;
      font-weight: 700;
      outline: none;
      transition: all 0.2s ease;
    }
    .answer-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
    }
    .btn-submit {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0 26px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      transform: translateY(-1px);
    }

    .feedback-msg {
      font-size: 0.95rem;
      font-weight: 800;
      min-height: 26px;
      margin-bottom: 12px;
    }
    .msg-error { color: #dc2626; }
    .msg-success { color: #16a34a; }

    .hint-box {
      font-size: 0.9rem;
      color: #475569;
      background: #f1f5f9;
      border: 1.5px dashed #cbd5e1;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      display: none;
      margin-top: 12px;
    }

    .btn-hint {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      color: #475569;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-hint:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    /* Certificate Modal */
    .cert-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .cert-card {
      background: #ffffff;
      border: 3px solid #38bdf8;
      border-radius: 24px;
      max-width: 600px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(14, 165, 233, 0.35);
      position: relative;
    }
    .cert-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #0284c7;
      margin-bottom: 8px;
    }
    .cert-body {
      font-size: 1.05rem;
      color: #334155;
      line-height: 1.7;
      margin: 16px 0 24px;
    }
    .btn-cert-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 24px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      border: none;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="back-nav-row">
        <a href="https://hungjuiying0606-dotcom.github.io/personal-main-hub/" class="back-nav">🏠 回主首頁</a>
        <a href="../../escape-rooms.html" class="back-nav">🗝️ 密室逃脫專區</a>
        <a href="../../hall-of-fame.html" class="back-nav">🏛️ 世界名人堂</a>
      </div>
      <h1 class="lab-title"><i class="fa-solid fa-key"></i> 哈伯深空探索 ─ 膨脹宇宙密室逃脫</h1>
      <p class="lab-subtitle">HUBBLE DEEP SPACE ESCAPE</p>
    </header>

    <div class="card" id="gameCard">
      <!-- Status Bar -->
      <div class="top-status-bar">
        <div class="status-item">
          <i class="fa-solid fa-clock"></i>
          <span>時間：<strong id="timerVal">00:00</strong></span>
        </div>
        <div class="status-item">
          <i class="fa-solid fa-trophy"></i>
          <span>關卡進度：<strong id="progressText">1 / 5</strong></span>
        </div>
      </div>

      <!-- Stages Map -->
      <div class="stages-map" id="stagesMap">
        <div class="stage-pill active" id="pill-0">關卡 1</div>
        <div class="stage-pill" id="pill-1">關卡 2</div>
        <div class="stage-pill" id="pill-2">關卡 3</div>
        <div class="stage-pill" id="pill-3">關卡 4</div>
        <div class="stage-pill" id="pill-4">關卡 5</div>
      </div>

      <!-- Question Box -->
      <div class="quest-box" id="questBox">
        <h3 class="quest-title" id="stageTitle">關卡載入中...</h3>
        <p class="quest-clue" id="stageClue">線索載入中...</p>
        <p class="quest-prompt" id="stagePrompt">題目載入中...</p>

        <div class="input-row">
          <input type="text" id="ansInput" class="answer-input" placeholder="請在此輸入答案..." autocomplete="off" />
          <button class="btn-submit" onclick="submitAnswer()">解鎖通關 ➔</button>
        </div>

        <div class="feedback-msg" id="feedbackMsg"></div>

        <div class="hint-box" id="hintBox">
          <i class="fa-solid fa-lightbulb"></i> <span id="hintText"></span>
        </div>
      </div>

      <!-- Certificate Box -->
      <div class="cert-box" id="certBox">
        <div class="cert-card">
          <div style="font-size: 3rem; margin-bottom: 10px;">🏆✨</div>
          <h2 class="cert-title">世界名人堂 · 榮譽通關證書</h2>
          <p style="color: #94a3b8; font-size: 0.85rem;">OFFICIAL CERTIFICATE OF COMPLETION</p>
          
          <div class="cert-name" id="certStudentName">傑出科學探索者</div>
          <p class="cert-desc">
            恭喜你成功破解<strong>【哈伯深空探索 ─ 膨脹宇宙密室逃脫】</strong>全部五大閱讀理解關卡！展現了卓越的科學探究思維與嚴謹的解謎精神！
          </p>
          <div style="font-size: 0.85rem; color: #f59e0b; font-family: monospace;">
            通關時間：<span id="finalTime"></span> · 國二科學發展史認證
          </div>
        </div>

        <button class="btn-submit" onclick="location.reload()" style="padding: 12px 30px; border-radius: 9999px;">
          <i class="fa-solid fa-rotate-right"></i> 重新挑戰
        </button>
      </div>
    </div>
  </div>

  <script>
    const STAGES = [{"id": "1", "title": "第 1 關：仙女座大星系 VAR! 變星標定", "clue": "哈伯在仙女座 M31 照相底片上發現了一顆光度規律變化的「造父變星」。根據勒維特法則，這顆變星的光變週期為 31.4 天，對應的絕對星等計算出它距離我們約 90 萬光年，打破了銀河系邊界！", "question": "請輸入哈伯在底片上發現造父變星時激動寫下的三個英文字母（全大寫）：", "answer": "VAR", "hint": "提示：代表 Variable Star（變星）的縮寫，共 3 個英文字母！"}, {"id": "2", "title": "第 2 關：星系光譜紅移校準", "clue": "當星系遠離我們時，其光譜譜線會向波長較長的紅色端偏移（都卜勒紅移效應）。光譜頻率降低、波長增加。", "question": "觀測到遙遠星系的光譜向長波長端移動，這種現象稱為「_____」效應？（請輸入兩個中文字）", "answer": "紅移", "hint": "提示：光譜偏向紅端，稱為「紅〇」。"}, {"id": "3", "title": "第 3 關：哈伯音叉星系分類", "clue": "哈伯將星系分為橢圓星系 (E)、正常螺旋星系 (S)、棒旋星系 (SB) 與不規則星系 (Irr)。銀河系與仙女座星系屬於哪一種具有漩渦手臂的星系？", "question": "具有旋臂結構的星系統稱為「____星系」？（請輸入兩個中文字，如：螺旋/橢圓）", "answer": "螺旋", "hint": "提示：形狀像漩渦或螺紋的星系。"}, {"id": "4", "title": "第 4 關：哈伯定律膨脹公式", "clue": "哈伯定律公式為 V = H₀ × D，其中 V 為星系退行速度，D 為距離，H₀ 為哈伯常數。這代表星系退行速度與距離成「正比」。", "question": "若距離 10 Mpc 的星系退行速度為 700 km/s，則距離 30 Mpc 的星系退行速度應為多少 km/s？（請輸入純數字）", "answer": "2100", "hint": "提示：退行速度與距離成正比，距離放大 3 倍，速度也是 3 倍！"}, {"id": "5", "title": "第 5 關：哈伯太空望遠鏡升空年份", "clue": "為了紀念愛德溫·哈伯，NASA 於 20 世紀末將人類史上最著名的太空望遠鏡送入軌道，揭開深空宇宙面貌。", "question": "哈伯太空望遠鏡於西元哪一年升空服役？（請輸入西元年 4 位數字）", "answer": "1990", "hint": "提示：西元 1990 年！"}];
    let currentStageIndex = 0;
    let timerSeconds = 0;
    let timerInterval = null;
    let studentName = '';

    function startTimer() {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const s = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('timerVal').textContent = `${m}:${s}`;
      }, 1000);
    }

    function loadStage(index) {
      if (index >= STAGES.length) {
        finishGame();
        return;
      }
      currentStageIndex = index;
      const stage = STAGES[index];
      document.getElementById('stageTitle').textContent = stage.title;
      document.getElementById('stageClue').innerHTML = stage.clue;
      document.getElementById('stagePrompt').innerHTML = stage.question;
      document.getElementById('progressText').textContent = `${index + 1} / ${STAGES.length}`;
      document.getElementById('ansInput').value = '';
      document.getElementById('feedbackMsg').textContent = '';
      document.getElementById('hintBox').style.display = 'none';
      document.getElementById('ansInput').focus();

      for (let i = 0; i < STAGES.length; i++) {
        const pill = document.getElementById(`pill-${i}`);
        if (pill) {
          pill.className = 'stage-pill';
          if (i < index) pill.classList.add('solved');
          if (i === index) pill.classList.add('active');
        }
      }
    }

    function submitAnswer() {
      const userAns = document.getElementById('ansInput').value.trim().toUpperCase();
      const stage = STAGES[currentStageIndex];
      const correctAns = stage.answer.trim().toUpperCase();

      const msg = document.getElementById('feedbackMsg');
      if (userAns === correctAns) {
        msg.className = 'feedback-msg msg-success';
        msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> 密碼正確！正在前往下一關...';
        setTimeout(() => {
          loadStage(currentStageIndex + 1);
        }, 800);
      } else {
        msg.className = 'feedback-msg msg-error';
        msg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> 密碼錯誤，請重新閱讀線索！';
        document.getElementById('hintBox').style.display = 'block';
        document.getElementById('hintText').textContent = stage.hint;
      }
    }

    document.getElementById('ansInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') submitAnswer();
    });

    function finishGame() {
      clearInterval(timerInterval);
      document.getElementById('questBox').style.display = 'none';
      document.getElementById('stagesMap').style.display = 'none';
      document.getElementById('certBox').style.display = 'block';

      studentName = prompt('恭喜通關！請輸入您的姓名以生成專屬榮譽證書：') || '傑出探索者';
      document.getElementById('certStudentName').textContent = studentName;
      
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('finalTime').textContent = `${m}分${s}秒`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      startTimer();
      loadStage(0);
    });
  </script>
</body>
</html>
