<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡文迪許實驗室 ─ DNA 雙螺旋解碼密室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0a0915;
      --card-bg: rgba(18, 16, 38, 0.9);
      --card-border: rgba(255, 255, 255, 0.15);
      --theme-color: #06b6d4;
      --accent: #22d3ee;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', 'Outfit', sans-serif;
      background-color: #030712;
      background-image: linear-gradient(135deg, #083344 0%, #155e75 50%, #030712 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 860px;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }
    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      color: #ffffff;
      font-size: 0.85rem;
      text-decoration: none;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
    }
    .back-nav:hover {
      background-color: var(--theme-color);
      color: #000000;
    }
    .lab-title {
      font-size: 2.1rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 25px #06b6d4;
      margin-bottom: 6px;
    }
    .lab-subtitle {
      font-size: 0.85rem;
      color: var(--accent);
      letter-spacing: 3px;
      font-family: 'Share Tech Mono', monospace;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .top-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 12px 20px;
      margin-bottom: 25px;
      font-family: 'Share Tech Mono', monospace;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }
    .status-item i { color: var(--theme-color); }

    /* Stage Steps Map */
    .stages-map {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }
    .stage-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-sm);
      padding: 8px 4px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }
    .stage-pill.active {
      background: var(--theme-color);
      color: #000000;
      border-color: var(--theme-color);
      box-shadow: 0 0 15px var(--theme-color);
    }
    .stage-pill.solved {
      background: rgba(34, 197, 94, 0.2);
      border-color: #22c55e;
      color: #4ade80;
    }

    /* Question Panel */
    .quest-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 20px;
    }
    .quest-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .quest-clue {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 15px;
    }
    .quest-prompt {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 15px;
      padding-top: 10px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .answer-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 1.1rem;
      color: #ffffff;
      font-weight: 700;
      outline: none;
      transition: all 0.2s ease;
    }
    .answer-input:focus {
      border-color: var(--theme-color);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .btn-submit {
      background: var(--theme-color);
      color: #000000;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0 24px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      filter: brightness(1.15);
      box-shadow: 0 0 20px var(--theme-color);
    }

    .feedback-msg {
      font-size: 0.9rem;
      font-weight: 700;
      min-height: 24px;
      margin-bottom: 10px;
    }
    .msg-error { color: #ef4444; }
    .msg-success { color: #22c55e; }

    .hint-box {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      display: none;
    }

    /* Certificate Screen */
    .cert-box {
      display: none;
      text-align: center;
      padding: 20px;
    }
    .cert-card {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      border: 3px solid #f59e0b;
      border-radius: var(--radius-lg);
      padding: 35px;
      margin: 20px auto;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.3);
      max-width: 600px;
    }
    .cert-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #f59e0b;
      margin-bottom: 10px;
    }
    .cert-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #ffffff;
      border-bottom: 2px solid #f59e0b;
      display: inline-block;
      padding: 0 20px 4px;
      margin: 15px 0;
    }
    .cert-desc {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.7;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="../../dna.html" class="back-nav">
        <i class="fa-solid fa-arrow-left"></i> 回到 華生、克立克、富蘭克林 課堂教學網頁
      </a>
      <h1 class="lab-title"><i class="fa-solid fa-key"></i> 卡文迪許實驗室 ─ DNA 雙螺旋解碼密室</h1>
      <p class="lab-subtitle">DNA DOUBLE HELIX ESCAPE</p>
    </header>

    <div class="card" id="gameCard">
      <!-- Status Bar -->
      <div class="top-status-bar">
        <div class="status-item">
          <i class="fa-solid fa-clock"></i>
          <span>時間：<strong id="timerVal">00:00</strong></span>
        </div>
        <div class="status-item">
          <i class="fa-solid fa-trophy"></i>
          <span>關卡進度：<strong id="progressText">1 / 5</strong></span>
        </div>
      </div>

      <!-- Stages Map -->
      <div class="stages-map" id="stagesMap">
        <div class="stage-pill active" id="pill-0">關卡 1</div>
        <div class="stage-pill" id="pill-1">關卡 2</div>
        <div class="stage-pill" id="pill-2">關卡 3</div>
        <div class="stage-pill" id="pill-3">關卡 4</div>
        <div class="stage-pill" id="pill-4">關卡 5</div>
      </div>

      <!-- Question Box -->
      <div class="quest-box" id="questBox">
        <h3 class="quest-title" id="stageTitle">關卡載入中...</h3>
        <p class="quest-clue" id="stageClue">線索載入中...</p>
        <p class="quest-prompt" id="stagePrompt">題目載入中...</p>

        <div class="input-row">
          <input type="text" id="ansInput" class="answer-input" placeholder="請在此輸入答案..." autocomplete="off" />
          <button class="btn-submit" onclick="submitAnswer()">解鎖通關 ➔</button>
        </div>

        <div class="feedback-msg" id="feedbackMsg"></div>

        <div class="hint-box" id="hintBox">
          <i class="fa-solid fa-lightbulb"></i> <span id="hintText"></span>
        </div>
      </div>

      <!-- Certificate Box -->
      <div class="cert-box" id="certBox">
        <div class="cert-card">
          <div style="font-size: 3rem; margin-bottom: 10px;">🏆✨</div>
          <h2 class="cert-title">世界名人堂 · 榮譽通關證書</h2>
          <p style="color: #94a3b8; font-size: 0.85rem;">OFFICIAL CERTIFICATE OF COMPLETION</p>
          
          <div class="cert-name" id="certStudentName">傑出科學探索者</div>
          <p class="cert-desc">
            恭喜你成功破解<strong>【卡文迪許實驗室 ─ DNA 雙螺旋解碼密室】</strong>全部五大閱讀理解關卡！展現了卓越的科學探究思維與嚴謹的解謎精神！
          </p>
          <div style="font-size: 0.85rem; color: #f59e0b; font-family: monospace;">
            通關時間：<span id="finalTime"></span> · 國二科學發展史認證
          </div>
        </div>

        <button class="btn-submit" onclick="location.reload()" style="padding: 12px 30px; border-radius: 9999px;">
          <i class="fa-solid fa-rotate-right"></i> 重新挑戰
        </button>
      </div>
    </div>
  </div>

  <script>
    const STAGES = [{"id": "1", "title": "第 1 關：富蘭克林的 Photo 51", "clue": "羅莎琳·富蘭克林利用 X 射線晶體繞射技術，拍下了代號為 Photo 51 的關鍵照片。照片中央呈現醒目的「X」十字交錯斑點，直接指出了 DNA 的立體構型必定是螺旋形！", "question": "富蘭克林拍下開啟雙螺旋大門的關鍵 X 射線照片代號為「Photo ___」？（請輸入兩位數字）", "answer": "51", "hint": "提示：五十一號照片，輸入數字 51！"}, {"id": "2", "title": "第 2 關：鹼基互補配對法則", "clue": "DNA 由四種含氮鹼基組成：A（腺嘌呤）、T（胸腺嘧啶）、C（胞嘧啶）、G（鳥嘌呤）。在雙螺旋內部，A 與 T 配對，C 與 G 配對。", "question": "若 DNA 一條鏈上的鹼基為 <code>A-G-C-T</code>，則與其互補配對的另一條鏈鹼基序列為何？（請輸入四個英文字母，如 TCGA）", "answer": "TCGA", "hint": "提示：A 配 T、G 配 C、C 配 G、T 配 A ➔ TCGA！"}, {"id": "3", "title": "第 3 關：雙螺旋的外部骨架", "clue": "DNA 雙螺旋的外側扶手骨架是由兩種分子交替連結而成：去氧核糖與磷酸基團。", "question": "構成 DNA 外側骨架的五碳糖全稱為「____核糖」？（請輸入兩個中文字）", "answer": "去氧", "hint": "提示：比核糖少一個氧原子，稱為「去氧」核糖！"}, {"id": "4", "title": "第 4 關：雙螺旋論文發表年份", "clue": "華生與克立克在英國《自然 (Nature)》雜誌發表了一篇僅一頁多的劃時代論文，宣佈發現了 DNA 雙螺旋結構。", "question": "DNA 雙螺旋結構模型發表於西元哪一年？（請輸入西元年 4 位數字）", "answer": "1953", "hint": "提示：西元 1953 年！"}, {"id": "5", "title": "第 5 關：DNA 半保留複製", "clue": "DNA 複製時兩股如拉鍊般解開，各自以原本的舊鏈為模板合成一條新鏈。複製完成後的兩條新 DNA 分子中，皆含有一條舊鏈與一條新鏈。", "question": "這種保留了一半原有母鏈的複製方式稱為「____複製」？（請輸入三個中文字）", "answer": "半保留", "hint": "提示：保留一半舊鏈，稱為「半保留」複製！"}];
    let currentStageIndex = 0;
    let timerSeconds = 0;
    let timerInterval = null;
    let studentName = '';

    function startTimer() {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const s = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('timerVal').textContent = `${m}:${s}`;
      }, 1000);
    }

    function loadStage(index) {
      if (index >= STAGES.length) {
        finishGame();
        return;
      }
      currentStageIndex = index;
      const stage = STAGES[index];
      document.getElementById('stageTitle').textContent = stage.title;
      document.getElementById('stageClue').innerHTML = stage.clue;
      document.getElementById('stagePrompt').innerHTML = stage.question;
      document.getElementById('progressText').textContent = `${index + 1} / ${STAGES.length}`;
      document.getElementById('ansInput').value = '';
      document.getElementById('feedbackMsg').textContent = '';
      document.getElementById('hintBox').style.display = 'none';
      document.getElementById('ansInput').focus();

      for (let i = 0; i < STAGES.length; i++) {
        const pill = document.getElementById(`pill-${i}`);
        if (pill) {
          pill.className = 'stage-pill';
          if (i < index) pill.classList.add('solved');
          if (i === index) pill.classList.add('active');
        }
      }
    }

    function submitAnswer() {
      const userAns = document.getElementById('ansInput').value.trim().toUpperCase();
      const stage = STAGES[currentStageIndex];
      const correctAns = stage.answer.trim().toUpperCase();

      const msg = document.getElementById('feedbackMsg');
      if (userAns === correctAns) {
        msg.className = 'feedback-msg msg-success';
        msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> 密碼正確！正在前往下一關...';
        setTimeout(() => {
          loadStage(currentStageIndex + 1);
        }, 800);
      } else {
        msg.className = 'feedback-msg msg-error';
        msg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> 密碼錯誤，請重新閱讀線索！';
        document.getElementById('hintBox').style.display = 'block';
        document.getElementById('hintText').textContent = stage.hint;
      }
    }

    document.getElementById('ansInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') submitAnswer();
    });

    function finishGame() {
      clearInterval(timerInterval);
      document.getElementById('questBox').style.display = 'none';
      document.getElementById('stagesMap').style.display = 'none';
      document.getElementById('certBox').style.display = 'block';

      studentName = prompt('恭喜通關！請輸入您的姓名以生成專屬榮譽證書：') || '傑出探索者';
      document.getElementById('certStudentName').textContent = studentName;
      
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('finalTime').textContent = `${m}分${s}秒`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      startTimer();
      loadStage(0);
    });
  </script>
</body>
</html>
