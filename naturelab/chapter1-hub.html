      --text-muted: #5f7188;

      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-solid: 5px 6px #203a5b;

      margin: 0;
      padding: 0;

    body {

      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

      height: 70px;
      padding: 0 max(22px, calc((100vw - 1160px) / 2));
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2.5px solid var(--primary);
      background: #ffffff;
    }

    .nav-brand {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-badge {
      background: #ffd85c;
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
      border: 1.5px solid var(--primary);
      font-size: 0.75rem;
      font-weight: 900;
    }

    main {
      max-width: 1160px;
      margin: 2rem auto;
      padding: 0 1.25rem;
      flex: 1;
      width: 100%;
    }

      color: #ffffff;
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      border: 3px solid var(--primary);
      box-shadow: 8px 10px var(--primary);
      margin-bottom: 2.5rem;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      align-items: center;
      gap: 1.5rem;
    }

    @media (max-width: 800px) {
      .hero-banner {
        grid-template-columns: 1fr;
      }
    }

    .hero-tag {
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 0.5rem;
      display: inline-block;
    }

    .hero-title {
      font-size: clamp(1.8rem, 3.5vw, 2.5rem);
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 0.8rem;
    }

    .hero-desc {
      font-size: 0.95rem;
      opacity: 0.9;
      line-height: 1.7;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .hero-stat-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: var(--radius-md);
      padding: 1rem;
      text-align: center;
    }

    .hero-stat-num {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
    }

    .hero-stat-label {
      font-size: 0.8rem;
      opacity: 0.85;
    }

      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

      padding: 0.55rem 1.1rem;
      border: 2px solid var(--primary);
      border-radius: 99px;
      background: #ffffff;
      color: var(--primary);
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 3px 3px var(--primary);
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .filter-btn:hover {
      background: var(--accent);
      transform: translateY(-2px);
    }

    .filter-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 4px 4px var(--accent);
    }

    
    /* Section Group Styles */
    .section-block {
      margin-bottom: 3.5rem;
    }
    .section-block-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      border-bottom: 2.5px solid var(--primary);
      padding-bottom: 0.6rem;
      margin-bottom: 1.5rem;

      font-size: 1.4rem;
      font-weight: 900;
      color: var(--primary);
    }
    .section-block-desc {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;

      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-solid);

      box-shadow: var(--shadow-hover);
    }

      justify-content: space-between;
      align-items: center;
      border-bottom: 2.5px solid var(--primary);

    .card-icon {
      font-size: 2rem;
    }

    .card-badge {
      padding: 0.25rem 0.6rem;
      border: 1.5px solid var(--primary);
      border-radius: 99px;
      background: #ffffff;
      font-size: 0.75rem;
      font-weight: 900;
      color: var(--primary);

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;

      font-weight: 900;
      margin-bottom: 0.3rem;

      font-weight: 900;
      color: var(--primary);
      line-height: 1.35;
      margin-bottom: 0.5rem;

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.25rem;
      flex: 1;

      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;

      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;

      font-family: inherit;

    .btn-play:hover {

    .btn-link {

      border: 2px solid var(--primary);
      border-radius: 10px;
      background: #f8fafc;
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 900;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-link:hover {
      background: var(--accent);

      left: 0;

      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: center;

      border: none;
      display: block;
    }

      text-align: center;
      padding: 1.5rem;

        }

        const groupTools = tools.filter(t => t.group === grpKey);
        if (groupTools.length === 0) return;

        const secBlock = document.createElement('section');
        secBlock.className = 'section-block';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'section-block-header';
        headerDiv.innerHTML = `
          <h2 class="section-block-title">${groupMeta[grpKey].title}</h2>
          <span class="section-block-desc">${groupMeta[grpKey].desc}</span>
        `;
        secBlock.appendChild(headerDiv);

        const gridDiv = document.createElement('div');
        gridDiv.className = 'tools-grid';

        groupTools.forEach((t) => {
          const card = document.createElement('div');
          card.className = `tool-card ${t.color}`;
          card.innerHTML = `
            <div class="card-top">
              <span class="card-icon">${t.icon}</span>
              <span class="card-badge">${t.page}</span>
            </div>
            <div class="card-body">
              <span class="card-section">${t.categoryName} · ${t.secName}</span>
              <h3 class="card-title">${t.title}</h3>
              <p class="card-desc">${t.desc}</p>
              <div class="card-actions">
                <button type="button" class="btn-play" onclick="openModal('${t.id}')">
                  ⚡ 即刻體驗
                </button>
                <a href="./${t.file}" target="_blank" class="btn-link" title="在新分頁全螢幕開啟（適合電子白板投影）">
                  ↗
                </a>
              </div>
            </div>
          `;
          gridDiv.appendChild(card);
        });

        secBlock.appendChild(gridDiv);
        container.appendChild(secBlock);
      });
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderTools(cat);
    }

    function openModal(toolId) {
      const t = tools.find(item => item.id === toolId);
      if (!t) return;

      document.getElementById('modalIcon').innerText = t.icon;
      document.getElementById('modalTitle').innerText = t.title;
      document.getElementById('modalPage').innerText = `(${t.page})`;
      document.getElementById('modalExtLink').href = `./${t.file}`;
      document.getElementById('modalIframe').src = `./${t.file}`;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.getElementById('modalIframe').src = '';
    }

    // Startup
    window.addEventListener('DOMContentLoaded', () => {
      renderTools('all');
    });
  </script>
</body>
</html>
