            <!-- 個人定位與簡介 -->

              <p>
                歡迎來到個人學習與教學創作基地！整合國中自然實驗室、世界名人堂、沉浸式密室逃脫解謎及智慧教學工具。

            <div>

            <div class="text-xs font-semibold text-slate-500 bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm flex-shrink-0">

          <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-5" aria-live="polite">
            <!-- 骨架載入動畫 -->
            <div class="col-span-full py-16 flex flex-col items-center justify-center text-slate-400 space-y-3">
              <div class="w-8 h-8 border-3 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
              <p class="text-sm">正在載入專案資料...</p>
            </div>
          </div>

          <!-- 無符合結果空狀態 (Empty State) -->
          <div id="empty-state" class="hidden py-16 px-6 text-center bg-white/70 backdrop-blur-sm rounded-2xl border border-dashed border-slate-300">

              type="button"
              class="mt-4 px-4 py-1.5 text-xs font-semibold text-sky-600 bg-sky-50 hover:bg-sky-100 rounded-lg transition-colors"

          <!-- 內嵌專屬網頁檢視器 (Embed Viewer) -->

            <!-- 內嵌工具列 -->
            <div class="flex items-center justify-between bg-white p-3 sm:p-4 px-4 sm:px-5 rounded-2xl border border-slate-200/90 shadow-soft">
